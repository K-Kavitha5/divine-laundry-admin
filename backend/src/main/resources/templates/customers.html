<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Customers')}"></head><body>
<aside th:replace="~{fragments :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments :: topbar('Customers')}"></header><main>
<div class="page-heading"><div><p class="eyebrow">CUSTOMERS</p><h1>Customer records</h1><p>One customer profile can have multiple separate orders.</p></div><a class="button" th:href="@{/customers/new}">＋ Add customer</a></div>
<section class="card"><form class="search" th:action="@{/customers}" method="get"><input aria-label="Search customers" name="q" th:value="${q}" placeholder="Search name or mobile number"><button type="submit">Search</button></form>
<p>Showing up to 30 matches. Narrow your search if needed.</p><div class="table-scroll"><table><thead><tr><th>Customer</th><th>Mobile</th><th>Area</th><th>Orders</th><th>Outstanding</th><th></th></tr></thead><tbody>
<tr th:each="row : ${customers}"><td><a th:href="@{/customers/{id}(id=${row.customer.id})}" th:text="${row.customer.name}"></a><small th:text="${row.customer.active ? 'Active' : 'Inactive'}"></small></td><td th:text="${row.customer.phone}"></td><td th:text="${row.customer.area}"></td><td th:text="${row.orderCount}"></td><td th:text="|₹${row.outstanding}|"></td><td><a class="button secondary" th:href="@{/customers/{id}(id=${row.customer.id})}">View</a><a class="button secondary" th:if="${row.customer.active}" th:href="@{/orders/new(customerId=${row.customer.id})}">New order →</a></td></tr>
<tr th:if="${#lists.isEmpty(customers)}"><td colspan="6" class="empty">No matching customers. Add a customer to get started.</td></tr></tbody></table></div></section>
</main></div></body></html>
