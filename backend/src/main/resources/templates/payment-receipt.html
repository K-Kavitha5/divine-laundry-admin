<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Payment receipt')}"></head><body class="invoice-page">
<div class="print-toolbar"><a th:href="@{/orders/{n}(n=${receipt.orderNumber})}">← Order</a><button type="button" data-print>Print receipt</button><a class="button secondary" th:href="@{/orders/{n}/payments/{p}/receipt.pdf(n=${receipt.orderNumber},p=${receipt.paymentNumber})}">Download PDF</a></div>
<main class="invoice-sheet receipt-sheet"><header class="invoice-header"><div><h1 th:text="${receipt.business.name}"></h1><p th:text="${receipt.business.address}"></p><p th:text="${receipt.business.phone}"></p><p th:if="${!#strings.isEmpty(receipt.business.gstNumber)}" th:text="|GST: ${receipt.business.gstNumber}|"></p></div><div><h2>PAYMENT RECEIPT</h2><b th:text="${receipt.receiptNumber}"></b><p th:text="${receipt.paymentDate == null ? 'Date not set' : #temporals.format(receipt.paymentDate.atZone(businessZone), 'dd MMM yyyy, hh:mm a')}"></p></div></header>
<div class="two-column"><section><p class="eyebrow">CUSTOMER</p><h2 th:text="${receipt.customerName}"></h2><p th:text="${receipt.customerPhone}"></p><p th:if="${receipt.customerAddress != null}" th:text="${receipt.customerAddress}"></p><p th:if="${receipt.customerArea != null}" th:text="${receipt.customerArea}"></p></section><section><p>Order: <b th:text="${receipt.orderNumber}"></b></p><p>Invoice: <b th:text="${receipt.invoiceNumber == null ? 'Not available' : receipt.invoiceNumber}"></b></p><p>Payment mode: <b th:text="${receipt.paymentMode}"></b></p><p>Reference: <b th:text="${receipt.transactionReference == null ? 'Not provided' : receipt.transactionReference}"></b></p><p>Recorded by: <b th:text="${receipt.createdBy}"></b></p></section></div>
<section class="receipt-summary"><h2>Payment received</h2><table><tbody><tr><th>Order total</th><td th:text="|₹${receipt.orderTotal}|"></td></tr><tr><th>Previous outstanding</th><td th:text="|₹${receipt.previousOutstanding}|"></td></tr><tr><th>Amount received</th><td class="receipt-amount" th:text="|₹${receipt.amountReceived}|"></td></tr><tr><th>Remaining outstanding</th><td th:text="|₹${receipt.remainingOutstanding}|"></td></tr><tr><th>Payment status</th><td><span class="badge" th:text="${receipt.paymentStatus}"></span></td></tr></tbody></table></section>
<p class="invoice-thanks">Thank you for choosing <span th:text="${receipt.business.name}">Divine Laundry</span>.</p></main></body></html>
