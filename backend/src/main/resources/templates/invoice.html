<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Invoice')}"></head><body class="invoice-page">
<div class="print-toolbar"><a th:href="@{/orders/{n}(n=${document.order.orderNumber})}">← Order</a><button type="button" data-print>Print / Save as PDF</button><a class="button secondary" th:href="@{/orders/{n}/invoice.png(n=${document.order.orderNumber})}">Download invoice + payment PNG</a></div>
<main class="invoice-sheet"><header class="invoice-header"><div><h1 th:text="${document.business.name}"></h1><p th:text="${document.business.address}"></p><p th:text="${document.business.phone}"></p><p th:if="${!#strings.isEmpty(document.business.gstNumber)}" th:text="|GST: ${document.business.gstNumber}|"></p></div><div><h2>INVOICE</h2><b th:text="${document.order.invoiceNumber}"></b><p th:text="${document.order.orderNumber}"></p></div></header>
<div class="two-column"><section><p class="eyebrow">BILL TO</p><h2 th:text="${document.order.customer.name}"></h2><p th:text="${document.order.customer.phone}"></p><p th:text="${document.order.customer.addressLine}"></p><p th:text="${document.order.customer.area}"></p></section>
<section><p>Placed: <b th:text="${#temporals.format(document.order.placedAt.atZone(businessZone), 'dd MMM yyyy, hh:mm a')}"></b></p><p>Delivery: <b th:text="${document.order.deliveryAt == null ? 'Not set' : #temporals.format(document.order.deliveryAt.atZone(businessZone), 'dd MMM yyyy, hh:mm a')}"></b></p></section></div>
<table><thead><tr><th>Service</th><th>Qty / unit</th><th>Pieces</th><th>Rate</th><th>Amount</th></tr></thead><tbody><tr th:each="i : ${document.order.items}"><td th:text="${i.serviceName}"></td><td th:text="|${i.billableQuantity} ${i.pricingUnit}|"></td><td th:text="${i.pieceCount}"></td><td th:text="|₹${i.unitRate}|"></td><td th:text="|₹${i.lineTotal}|"></td></tr></tbody></table>
<div class="invoice-summary"><p>Subtotal <b th:text="|₹${document.order.subtotal}|"></b></p><p>Discount <b th:text="|− ₹${document.order.discount}|"></b></p><p>Tax <b th:text="|₹${document.order.tax}|"></b></p><p>Round-off <b th:text="|₹${document.order.roundOff}|"></b></p><p>Total <b th:text="|₹${document.order.total}|"></b></p><p>Paid <b th:text="|₹${document.paymentSummary.amountPaid}|"></b></p><p class="grand-total">Balance <b th:text="|₹${document.paymentSummary.balance}|"></b></p></div>
<p th:text="${document.order.notes}"></p><p class="invoice-thanks">Thank you for choosing Divine Laundry.</p></main></body></html>
