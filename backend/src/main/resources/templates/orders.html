<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Orders')}"></head><body>
<aside th:replace="~{fragments :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments :: topbar('Orders')}"></header><main>
<div class="page-heading"><div><p class="eyebrow">OPERATIONS</p><h1>Order desk</h1><p>Find the next order to receive, process, collect, or deliver.</p></div><a class="button" th:href="@{/orders/new}">＋ Create order</a></div>
<section class="card operations-filters"><form th:action="@{/orders}" method="get" class="filter-grid">
<label>Order number<input name="orderQuery" th:value="${orderQuery}" placeholder="SO-2026"></label>
<label>Customer<input name="customerQuery" th:value="${customerQuery}" placeholder="Name"></label>
<label>Phone<input name="phoneQuery" th:value="${phoneQuery}" placeholder="Mobile number"></label>
<label>Status<select name="status"><option value="">All statuses</option><option th:each="item : ${statuses}" th:value="${item}" th:text="${item}" th:selected="${item == status}"></option></select></label>
<label>Payment<select name="paymentStatus"><option value="">All payment states</option><option th:each="item : ${paymentStatuses}" th:value="${item}" th:text="${item}" th:selected="${item == paymentStatus}"></option></select></label>
<label>Order from<input type="date" name="orderFrom" th:value="${orderFrom}"></label><label>Order to<input type="date" name="orderTo" th:value="${orderTo}"></label>
<label>Pickup from<input type="date" name="pickupFrom" th:value="${pickupFrom}"></label><label>Pickup to<input type="date" name="pickupTo" th:value="${pickupTo}"></label>
<label>Delivery from<input type="date" name="deliveryFrom" th:value="${deliveryFrom}"></label><label>Delivery to<input type="date" name="deliveryTo" th:value="${deliveryTo}"></label>
<div class="filter-actions"><button type="submit">Apply filters</button><a class="button secondary" th:href="@{/orders}">Clear</a></div>
</form></section>
<section class="card"><div class="section-title"><h2>Orders</h2><span th:text="|${ordersPage.totalElements} records · page ${ordersPage.number + 1} of ${ordersPage.totalPages == 0 ? 1 : ordersPage.totalPages}|"></span></div>
<div class="table-scroll"><table class="operations-table"><thead><tr><th>Order / customer</th><th>Dates</th><th>Status</th><th>Billing</th><th>Tags</th><th></th></tr></thead><tbody>
<tr th:each="row : ${orderRows}"><td><a th:href="@{/orders/{number}(number=${row.order.orderNumber})}" th:text="${row.order.orderNumber}"></a><b th:text="${row.order.customer.name}"></b><small th:text="${row.order.customer.phone}"></small><small th:text="${#temporals.format(row.order.placedAt.atZone(businessZone), 'dd MMM yyyy, hh:mm a')}"></small></td>
<td><small>Pickup</small><span th:text="${row.order.pickupAt == null ? 'Not scheduled' : #temporals.format(row.order.pickupAt.atZone(businessZone), 'dd MMM, hh:mm a')}"></span><small>Delivery</small><span th:classappend="${row.order.deliveryAt != null and row.order.deliveryAt.isBefore(T(java.time.Instant).now()) and row.order.workStatus.name() != 'DELIVERED' and row.order.workStatus.name() != 'CANCELLED'} ? ' overdue'" th:text="${row.order.deliveryAt == null ? 'Not scheduled' : #temporals.format(row.order.deliveryAt.atZone(businessZone), 'dd MMM, hh:mm a')}"></span></td>
<td><span class="badge" th:text="${row.order.workStatus}"></span></td><td><b th:text="|₹${row.order.total}|"></b><small th:text="|Paid ₹${row.paid}|"></small><small th:text="|Balance ₹${row.balance}|"></small><span class="badge" th:text="${row.order.paymentStatus}"></span></td>
<td><b th:text="|${row.tagCount} / ${row.physicalTagCount} tags|"></b><small th:text="|${row.printedTagCount} printed · ${row.reprintCount} reprints|"></small></td><td><a class="button secondary" th:href="@{/orders/{number}(number=${row.order.orderNumber})}">Open</a></td></tr>
<tr th:if="${#lists.isEmpty(orderRows)}"><td colspan="6" class="empty">No orders match these filters.</td></tr></tbody></table></div>
<div class="pagination" th:if="${ordersPage.totalPages > 1}"><a class="button secondary" th:if="${ordersPage.hasPrevious()}" th:href="@{/orders(page=${ordersPage.number - 1},orderQuery=${orderQuery},customerQuery=${customerQuery},phoneQuery=${phoneQuery},status=${status},paymentStatus=${paymentStatus},orderFrom=${orderFrom},orderTo=${orderTo},pickupFrom=${pickupFrom},pickupTo=${pickupTo},deliveryFrom=${deliveryFrom},deliveryTo=${deliveryTo})}">Previous</a><span th:text="|Page ${ordersPage.number + 1} of ${ordersPage.totalPages}|"></span><a class="button secondary" th:if="${ordersPage.hasNext()}" th:href="@{/orders(page=${ordersPage.number + 1},orderQuery=${orderQuery},customerQuery=${customerQuery},phoneQuery=${phoneQuery},status=${status},paymentStatus=${paymentStatus},orderFrom=${orderFrom},orderTo=${orderTo},pickupFrom=${pickupFrom},pickupTo=${pickupTo},deliveryFrom=${deliveryFrom},deliveryTo=${deliveryTo})}">Next</a></div>
</section></main></div></body></html>
