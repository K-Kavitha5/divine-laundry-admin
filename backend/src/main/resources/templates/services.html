<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Services & prices')}"></head><body><aside th:replace="~{fragments :: sidebar}"></aside><div class="workspace"><header th:replace="~{fragments :: topbar('Services & prices')}"></header><main>
<p class="eyebrow">SAVED CATALOGUE</p><h1>Services &amp; prices</h1><p>Imported reference prices. Price editing will follow in a later milestone.</p><section class="card"><div class="table-scroll"><table><thead><tr><th>Category</th><th>Group</th><th>Service</th><th>Unit</th><th>Price</th></tr></thead><tbody><tr th:each="s : ${catalog}"><td th:text="${s.category}"></td><td th:text="${s.catalogGroup}"></td><td th:text="${s.name}"></td><td th:text="${s.pricingUnit}"></td><td th:text="${s.unitRate.signum() gt 0 ? '₹' + s.unitRate : 'Not confirmed — unavailable'}"></td></tr></tbody></table></div></section></main></div></body></html>
